<!DOCTYPE html>
<html>
<head>
<title>Drawing Canvas</title>

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
  text-align: center;
}

h1 {
  font-size: 36px;
}

#nameBox {
  width: 90%;
  margin: 10px auto;
  display: block;
  font-size: 100px;
  padding: 5px;
  text-align: center;
  box-sizing: border-box;
}

#toolbar {
  padding: 10px;
  background: white;
  border-bottom: 1px solid #ccc;
  font-size: 24px;
}

input, button {
  font-size: 24px;
  margin: 10px;
}

button {
  padding: 10px 20px;
}

#canvasContainer {
  width: 90%;
  height: 75vh;
  margin: 20px auto;
  border: 2px solid #333;
  background: white;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: none;
}

</style>

</head>


<body>


<h1>Drawing Board</h1>


<input id="nameBox" placeholder="Name">


<div id="toolbar">

Color:
<input type="color" id="colorPicker" value="#000000">

<br>

Brush Size:

<button onclick="changeBrush(-1)">-</button>

<input type="number" id="brushSize" value="5" min="1" max="50">

<button onclick="changeBrush(1)">+</button>

<br>


<button onclick="toggleCanvas()">Hide/Show</button>

<button onclick="undo()">Undo</button>

<button onclick="redo()">Redo</button>

<button onclick="clearCanvas()">Clear</button>

<button onclick="savePNG()">Save PNG</button>

<button onclick="sharePNG()">Send</button>


</div>



<div id="canvasContainer">

<canvas id="canvas"></canvas>

</div>




<script>


const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


let drawing = false;
let visible = true;


// Undo / Redo

let history = [];
let redoHistory = [];
let maxHistory = 20;



// Brush size

function changeBrush(amount){

  let input = document.getElementById("brushSize");

  let size = parseInt(input.value) + amount;


  if(size < 1){
    size = 1;
  }

  if(size > 50){
    size = 50;
  }


  input.value = size;

}




// Resize canvas

function resizeCanvas(){

  let temp = document.createElement("canvas");

  temp.width = canvas.width;
  temp.height = canvas.height;

  temp.getContext("2d").drawImage(canvas,0,0);


  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;


  ctx.drawImage(temp,0,0);

}


resizeCanvas();

window.addEventListener("resize", resizeCanvas);





// Save state

function saveState(){

  if(history.length >= maxHistory){
    history.shift();
  }


  history.push(canvas.toDataURL());


  redoHistory = [];

}





// Undo

function undo(){

  if(history.length === 0){
    return;
  }


  redoHistory.push(canvas.toDataURL());


  let img = new Image();

  img.src = history.pop();


  img.onload = function(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.drawImage(
      img,
      0,
      0
    );

  };

}





// Redo

function redo(){

  if(redoHistory.length === 0){
    return;
  }


  history.push(canvas.toDataURL());


  let img = new Image();

  img.src = redoHistory.pop();


  img.onload = function(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.drawImage(
      img,
      0,
      0
    );

  };

}





// Draw

function drawLine(x,y){

  ctx.lineWidth =
    document.getElementById("brushSize").value;


  ctx.lineCap = "round";


  ctx.strokeStyle =
    document.getElementById("colorPicker").value;


  ctx.lineTo(x,y);

  ctx.stroke();

}





// Mouse

canvas.addEventListener("mousedown",function(e){

  saveState();

  drawing = true;


  ctx.beginPath();

  ctx.moveTo(
    e.offsetX,
    e.offsetY
  );

});



canvas.addEventListener("mousemove",function(e){

  if(!drawing) return;


  drawLine(
    e.offsetX,
    e.offsetY
  );

});



canvas.addEventListener("mouseup",function(){

  drawing = false;

});


canvas.addEventListener("mouseleave",function(){

  drawing = false;

});






// Touch

canvas.addEventListener("touchstart",function(e){

  e.preventDefault();

  saveState();


  let rect = canvas.getBoundingClientRect();

  let touch = e.touches[0];


  drawing = true;


  ctx.beginPath();


  ctx.moveTo(
    touch.clientX - rect.left,
    touch.clientY - rect.top
  );

});



canvas.addEventListener("touchmove",function(e){

  e.preventDefault();


  if(!drawing){
    return;
  }


  let rect = canvas.getBoundingClientRect();

  let touch = e.touches[0];


  drawLine(
    touch.clientX - rect.left,
    touch.clientY - rect.top
  );

});



canvas.addEventListener("touchend",function(){

  drawing = false;

});







// Clear

function clearCanvas(){

  saveState();


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}





// Hide/show

function toggleCanvas(){

  visible = !visible;


  document.getElementById("canvasContainer").style.display =
    visible ? "block" : "none";

}





// Save PNG

function savePNG(){

  let link = document.createElement("a");


  link.download = "drawing.png";


  link.href = canvas.toDataURL("image/png");


  link.click();

}





// Share PNG

function sharePNG(){

  canvas.toBlob(function(blob){


    let file = new File(
      [blob],
      "drawing.png",
      {
        type:"image/png"
      }
    );


    if(
      navigator.share &&
      navigator.canShare({files:[file]})
    ){

      navigator.share({

        title:"Drawing",

        text:"My drawing",

        files:[file]

      });

    }
    else{

      alert("Sharing not supported on this device.");

    }


  });

}


</script>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Drawing Canvas</title>

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
  text-align: center;
}

h1 {
  font-size: 36px;
}


#nameBox {
  width: 90%;
  margin: 10px auto;
  display: block;
  font-size: 100px;
  padding: 5px;
  text-align: center;
  box-sizing: border-box;
}


#toolbar {
  padding: 10px;
  background: white;
  border-bottom: 1px solid #ccc;
  font-size: 24px;
}


input, button {
  font-size: 24px;
  margin: 5px;
}


#canvasContainer {
  width: 90%;
  height: 75vh;
  margin: 20px auto;
  border: 2px solid #333;
  background: white;
}


canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: none;
}


#bottomControls {
  width: 90%;
  margin: 10px auto;
  text-align: right;
}

</style>

</head>


<body>


<h1>Drawing Board</h1>


<input id="nameBox" placeholder="Name">


<div id="toolbar">

Color:
<input type="color" id="colorPicker" value="#000000">


Brush Size:
<input type="number" id="brushSize" value="5" min="1" max="50">


<button onclick="toggleCanvas()">Hide/Show</button>

</div>



<div id="canvasContainer">

<canvas id="canvas"></canvas>

</div>



<div id="bottomControls">

<button onclick="clearCanvas()">Clear</button>

<button onclick="savePNG()">Save PNG</button>

</div>




<script>


const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


let drawing = false;
let visible = true;



// Resize canvas and preserve drawing

function resizeCanvas() {

  let temp = document.createElement("canvas");

  temp.width = canvas.width;
  temp.height = canvas.height;

  temp.getContext("2d").drawImage(canvas,0,0);


  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;


  ctx.drawImage(temp,0,0);

}


resizeCanvas();

window.addEventListener("resize", resizeCanvas);




// Draw line

function drawLine(x,y) {

  ctx.lineWidth =
    document.getElementById("brushSize").value;


  ctx.lineCap = "round";


  ctx.strokeStyle =
    document.getElementById("colorPicker").value;


  ctx.lineTo(x,y);

  ctx.stroke();

}



// Mouse drawing

canvas.addEventListener("mousedown", function(e){

  drawing = true;

  ctx.beginPath();

  ctx.moveTo(e.offsetX,e.offsetY);

});


canvas.addEventListener("mousemove", function(e){

  if(!drawing) return;

  drawLine(e.offsetX,e.offsetY);

});


canvas.addEventListener("mouseup", function(){

  drawing = false;

});


canvas.addEventListener("mouseleave", function(){

  drawing = false;

});




// Touch drawing

canvas.addEventListener("touchstart", function(e){

  e.preventDefault();


  let rect = canvas.getBoundingClientRect();

  let touch = e.touches[0];


  drawing = true;


  ctx.beginPath();


  ctx.moveTo(
    touch.clientX - rect.left,
    touch.clientY - rect.top
  );

});



canvas.addEventListener("touchmove", function(e){

  e.preventDefault();


  if(!drawing) return;


  let rect = canvas.getBoundingClientRect();

  let touch = e.touches[0];


  drawLine(
    touch.clientX - rect.left,
    touch.clientY - rect.top
  );

});



canvas.addEventListener("touchend", function(){

  drawing = false;

});





// Clear drawing

function clearCanvas(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}




// Hide/show

function toggleCanvas(){

  visible = !visible;


  document.getElementById("canvasContainer").style.display =
    visible ? "block" : "none";

}




// Save PNG

function savePNG(){

  let link = document.createElement("a");


  link.download = "drawing.png";


  link.href = canvas.toDataURL("image/png");


  link.click();

}


</script>


</body>
</html>

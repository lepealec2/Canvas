<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

body{
  margin:0;
  font-family:Arial;
  text-align:center;
  background:#f5f5f5;
}

/* NAME */
#nameBox{
  width:90%;
  font-size:100px;
  text-align:center;
  margin:10px auto;
  display:block;
  box-sizing:border-box;
}

/* TOOLBAR */
#toolbar{
  background:#ddd;
  padding:10px;
  font-size:18px;
}

.row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:5px 0;
  flex-wrap:wrap;
}

/* BOTTOM */
#bottomControls{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#ddd;
  padding:10px;
  border-top:2px solid #aaa;
}

#bottomControls .row{
  display:flex;
  justify-content:space-evenly;
  align-items:center;
  flex-wrap:nowrap;
  gap:20px;
}

#bottomControls button{
  flex:1;
  max-width:220px;
}


button{
  font-size:18px;
  padding:5px 10px;
}

input{
  font-size:18px;
  padding:5px;
}

#modeIndicator{
  font-weight:bold;
  padding:5px 10px;
  border-radius:5px;
}

.drawMode{
  background:#c8f7c5;
}

.emojiMode{
  background:#f7d6c5;
}


canvas{
  border:2px solid black;
  touch-action:none;
  display:block;
  margin:0 auto;
}

</style>

</head>

<body>


<input id="nameBox" placeholder="Name">

<div class="row">
<button onclick="toggleSettings()">Hide / Show Settings</button>
<button onclick="toggleName()">Hide / Show Name</button>
</div>



<div id="toolbar">

<div id="controls">


<div class="row">
<span id="modeIndicator" class="drawMode">
Mode: Drawing
</span>

<button onclick="toggleMode()">
Switch Modes
</button>
</div>



<div class="row">

Brush Color:

<input type="color" id="colorPicker" value="#000000">


Brush Size:

<button onclick="changeBrush(-2)">-</button>

<span id="brushDisplay">5</span>

<button onclick="changeBrush(2)">+</button>
</div>






<div class="row">

Enter:

<input 
id="emojiInput"
value="😀"
style="width:120px;text-align:center;">

Size:

<button onclick="changeEmojiSize(-5)">-</button>

<span id="emojiSizeDisplay">25</span>

<button onclick="changeEmojiSize(5)">+</button>

</div>



<div class="row">

<button onclick="undo()">Undo</button>

<button onclick="redo()">Redo</button>

</div>


</div>

</div>



<canvas id="canvas"></canvas>



<div id="bottomControls">
<div class="row">


<button onclick="toggleCrop()">
Save/Send Auto Crop: ON
</button>

<button onclick="saveImage()">
Save as PNG
</button>

</div>
<div class="row">


<button onclick="shareImage()">
Send / Share
</button>

<button onclick="clearDrawing()">
Clear Lines
</button>

<button onclick="clearEverything()">
Clear Everything
</button>


</div>

</div>



<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");


canvas.width=window.innerWidth;
canvas.height=window.innerHeight-300;


let drawing=false;
let emojiMode=false;

let brushSize=5;
let emojiSize=25;


let undoStack=[];
let redoStack=[];

let emojiElements=[];


function toggleName(){

let name=document.getElementById("nameBox");

name.style.display=
name.style.display==="none"
?"block"
:"none";

}

function toggleSettings(){

let toolbar=document.getElementById("toolbar");

toolbar.style.display=
toolbar.style.display==="none"
?"block"
:"none";

}




function updateUI(){

document.getElementById("brushDisplay").innerText=brushSize;

document.getElementById("emojiSizeDisplay").innerText=emojiSize;


let indicator=document.getElementById("modeIndicator");


if(emojiMode){

indicator.innerText="Mode: Emoji/Text";
indicator.className="emojiMode";

}
else{

indicator.innerText="Mode: Drawing";
indicator.className="drawMode";

}

}



function toggleMode(){

emojiMode=!emojiMode;

updateUI();

}




function changeBrush(v){

brushSize=Math.max(1,brushSize+v);

updateUI();

}




function changeEmojiSize(v){

emojiSize=Math.max(5,emojiSize+v);

updateUI();

}




function saveState(){

undoStack.push(canvas.toDataURL());

redoStack=[];

}




function drawEmoji(x,y){

let text=document.getElementById("emojiInput").value;

emojiElements.push({
x:x,
y:y,
text:text,
size:emojiSize
});

redrawEmojis();

}




function redrawEmojis(){

emojiElements.forEach(e=>{

ctx.font=e.size+"px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(e.text,e.x,e.y);

});

}




function clearDrawing(){

saveState();

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

redrawEmojis();

}




function clearEverything(){

saveState();

emojiElements=[];

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}




let autoCrop=true;


function toggleCrop(){

autoCrop=!autoCrop;

event.target.innerText =
autoCrop
? "Auto Crop: ON"
: "Auto Crop: OFF";

}



function saveImage(){

if(!autoCrop){

let link=document.createElement("a");

link.download="drawing.png";

link.href=canvas.toDataURL("image/png");

link.click();

return;

}


// AUTO CROP

let imageData = ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);


let pixels=imageData.data;


let minX=canvas.width;
let minY=canvas.height;
let maxX=0;
let maxY=0;


for(let y=0;y<canvas.height;y++){

for(let x=0;x<canvas.width;x++){

let index=(y*canvas.width+x)*4;

let alpha=pixels[index+3];


if(alpha>0){

if(x<minX)minX=x;
if(x>maxX)maxX=x;
if(y<minY)minY=y;
if(y>maxY)maxY=y;

}

}

}


if(maxX===0 && maxY===0){

alert("Nothing to save");

return;

}



let cropWidth=maxX-minX+1;
let cropHeight=maxY-minY+1;


let cropCanvas=document.createElement("canvas");

cropCanvas.width=cropWidth;
cropCanvas.height=cropHeight;


let cropCtx=cropCanvas.getContext("2d");


cropCtx.drawImage(
canvas,
minX,
minY,
cropWidth,
cropHeight,
0,
0,
cropWidth,
cropHeight
);



let link=document.createElement("a");

link.download="drawing.png";

link.href=cropCanvas.toDataURL("image/png");

link.click();


}


async function shareImage(){

canvas.toBlob(async blob=>{

let file=new File(
[blob],
"drawing.png",
{type:"image/png"}
);


if(navigator.share){

await navigator.share({

title:"",

files:[file]

});

}

});

}





canvas.addEventListener("mousedown",e=>{

saveState();


if(emojiMode){

drawEmoji(
e.offsetX,
e.offsetY
);

return;

}


drawing=true;

ctx.beginPath();

ctx.moveTo(
e.offsetX,
e.offsetY
);

});





canvas.addEventListener("mousemove",e=>{


if(!drawing||emojiMode)return;


ctx.lineWidth=brushSize;

ctx.lineCap="round";

ctx.strokeStyle=
document.getElementById("colorPicker").value;


ctx.lineTo(
e.offsetX,
e.offsetY
);

ctx.stroke();


});



canvas.addEventListener(
"mouseup",
()=>drawing=false
);



canvas.addEventListener("touchstart",e=>{

e.preventDefault();

let rect=canvas.getBoundingClientRect();

let t=e.touches[0];


let x=t.clientX-rect.left;

let y=t.clientY-rect.top;


saveState();


if(emojiMode){

drawEmoji(x,y);

return;

}


drawing=true;

ctx.beginPath();

ctx.moveTo(x,y);


});



canvas.addEventListener("touchmove",e=>{

e.preventDefault();

if(!drawing||emojiMode)return;


let rect=canvas.getBoundingClientRect();

let t=e.touches[0];


let x=t.clientX-rect.left;

let y=t.clientY-rect.top;


ctx.lineWidth=brushSize;

ctx.lineCap="round";

ctx.strokeStyle=
document.getElementById("colorPicker").value;


ctx.lineTo(x,y);

ctx.stroke();


});


canvas.addEventListener(
"touchend",
()=>drawing=false
);



function undo(){

  if(undoStack.length === 0) return;

  redoStack.push(canvas.toDataURL());

  let img = new Image();

  img.src = undoStack.pop();

  img.onload = function(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.drawImage(
      img,
      0,
      0
    );

    redrawEmojis();

  };

}



function redo(){

  if(redoStack.length === 0) return;

  undoStack.push(canvas.toDataURL());

  let img = new Image();

  img.src = redoStack.pop();

  img.onload = function(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.drawImage(
      img,
      0,
      0
    );

    redrawEmojis();

  };

}

updateUI();

</script>

</body>
</html>
